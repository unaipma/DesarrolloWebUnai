<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agregar</title>
    <link rel="stylesheet" href="css/style.css" />
    <script defer src="./js/main.js"></script>
  </head>
  <body>
    <header>
      <div class="contenido-header">
        <a href="main.html">
          <img src="img/comerciologo.png" alt="logocomercio" id="logo"
        /></a>
        <h3>Librería comercio</h3>
      </div>
    </header>
    <img src="img/libreria.jpg" alt="libreria" />
    <h2>Agregar un libro</h2>
    <form id="formAgregar">
      <label for="titulo">Título:</label><br />
      <input type="text" id="titulo" name="titulo" required /><br /><br />

      <label for="autor">Autor:</label><br />
      <input type="text" id="autor" name="autor" required /><br /><br />

      <label for="paginas">Páginas:</label><br />
      <input type="number" id="paginas" name="paginas" required /><br /><br />

      <label for="prestado">Prestado</label><br />
      <input type="checkbox" id="prestado" name="prestado" /><br /><br />

      <input
        type="button"
        id="btnagregarlibro"
        value="Agregar Libro"
        class="btn"
      />
    </form>
  </body>
</html>
