<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Chuleta Grid & Flexbox</title>
<style>
/* =====================================================
 🧭 CHULETA CSS GRID Y FLEXBOX — para examen
 ===================================================== */

/* ==================== 🟩 GRID LAYOUT ==================== */

/* Activar grid en el contenedor */
.container {
  display: grid;
  grid-template-columns: 200px 1fr 2fr; /* columnas */
  grid-template-rows: 100px auto 50px;  /* filas */
  gap: 10px; /* espacio entre celdas */
}

/* Atajos comunes */
.container {
  grid-template: 100px auto 50px / 1fr 1fr 1fr; /* filas / columnas */
}

/* Posicionar elementos dentro del grid */
.item1 {
  grid-column: 1 / 3; /* ocupa de la columna 1 a la 3 */
  grid-row: 1 / 2;    /* ocupa de la fila 1 a la 2 */
}

/* O con nombres de áreas */
.container {
  display: grid;
  grid-template-areas:
    "header header"
    "menu main"
    "footer footer";
  grid-template-columns: 150px 1fr;
  grid-template-rows: 60px auto 40px;
}
.header { grid-area: header; }
.menu { grid-area: menu; }
.main { grid-area: main; }
.footer { grid-area: footer; }

/* Centrar con grid */
.centrado {
  display: grid;
  place-items: center; /* centra en ambas direcciones */
}

/* Distribuir elementos */
.auto-ajuste {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
}

/* ==================== 🟦 FLEXBOX ==================== */

/* Activar flex en el contenedor */
.flex {
  display: flex;
}

/* Dirección del eje principal */
.flex-row { flex-direction: row; }        /* horizontal (por defecto) */
.flex-column { flex-direction: column; }  /* vertical */

/* Alineación en el eje principal (horizontal por defecto) */
.flex { justify-content: center; }        /* centro */
.flex { justify-content: space-between; } /* extremos */
.flex { justify-content: space-around; }  /* con márgenes iguales */

/* Alineación en el eje cruzado (vertical por defecto) */
.flex { align-items: center; }    /* centra verticalmente */
.flex { align-items: flex-start; }/* arriba */
.flex { align-items: flex-end; }  /* abajo */

/* Alineación múltiple (varias filas) */
.flex-wrap { flex-wrap: wrap; } /* permite salto de línea */
.flex { align-content: center; } /* alinea varias filas */

/* Control individual de hijos */
.item {
  flex-grow: 1;   /* ocupa espacio sobrante */
  flex-shrink: 1; /* se encoge si falta espacio */
  flex-basis: 200px; /* tamaño base */
}

/* Atajo: flex: grow shrink basis */
.item2 { flex: 1 1 150px; }

/* Centrar todo con flex */
.centrar-todo {
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ==================== 🎨 EJEMPLOS PRÁCTICOS ==================== */

/* Grid simple de 3x3 */
.grid-demo {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
}

/* Flex fila centrada */
.flex-demo {
  display: flex;
  justify-content: space-evenly;
  align-items: center;
}
.flex-demo div {
  background: lightblue;
  padding: 10px;
  border-radius: 5px;
}

/* Visual bonito para recordar */
.box {
  background: lightcoral;
  color: white;
  font-weight: bold;
  text-align: center;
  padding: 10px;
  border-radius: 5px;
}
</style>
</head>
<body>
<h2>🧭 Chuleta CSS Grid & Flexbox</h2>

<h3>GRID Ejemplo:</h3>
<div class="container">
  <div class="box">1</div>
  <div class="box">2</div>
  <div class="box">3</div>
  <div class="box">4</div>
</div>

<h3>FLEX Ejemplo:</h3>
<div class="flex-demo">
  <div>Elemento 1</div>
  <div>Elemento 2</div>
  <div>Elemento 3</div>
</div>
</body>
</html>
