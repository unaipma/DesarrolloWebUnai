<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login y Registro</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 50px;
      }
      input {
        margin: 5px;
        padding: 5px;
        width: 200px;
      }
      .error {
        color: red;
      }
      .success {
        color: green;
      }
      .container {
        margin-bottom: 30px;
        border: 1px solid #ccc;
        padding: 20px;
        display: inline-block;
      }
      h2 {
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Iniciar sesión</h2>
      <input
        type="text"
        id="loginUsuario"
        placeholder="Usuario"
        autocomplete="username"
      /><br />
      <input
        type="password"
        id="loginPassword"
        placeholder="Contraseña"
        autocomplete="current-password"
      /><br />
      <button onclick="login()">Entrar</button>
      <p id="errorLogin"></p>
    </div>

    <div class="container">
      <h2>Registrarse</h2>
      <input
        type="text"
        id="regUsuario"
        placeholder="Usuario"
        autocomplete="username"
      /><br />
      <input
        type="password"
        id="regPassword"
        placeholder="Contraseña"
        autocomplete="new-password"
      /><br />
      <button onclick="registrar()">Registrar</button>
      <p id="errorRegistro"></p>
    </div>

    <script>
      // VALIDACIONES COMUNES
      function validarUsuario(usuario) {
        if (usuario.length < 3)
          return "El usuario debe tener al menos 3 caracteres.";
        if (!/^[a-zA-Z0-9]+$/.test(usuario))
          return "El usuario solo puede contener letras y números.";
        return "";
      }

      function validarPassword(password) {
        if (password.length < 4)
          return "La contraseña debe tener al menos 4 caracteres.";
        if (!/^[a-zA-Z0-9]+$/.test(password))
          return "La contraseña solo puede contener letras y números.";
        return "";
      }

      // REGISTRO
      function registrar() {
        const usuario = document.getElementById("regUsuario").value.trim();
        const password = document.getElementById("regPassword").value.trim();
        const mensaje = document.getElementById("errorRegistro");

        // Validaciones
        if (!usuario || !password) {
          mensaje.textContent = "Debes rellenar ambos campos.";
          mensaje.className = "error";
          return;
        }

        let errorUsuario = validarUsuario(usuario);
        if (errorUsuario) {
          mensaje.textContent = errorUsuario;
          mensaje.className = "error";
          return;
        }

        let errorPassword = validarPassword(password);
        if (errorPassword) {
          mensaje.textContent = errorPassword;
          mensaje.className = "error";
          return;
        }

        // Verificar si usuario existe
        let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];
        if (usuarios.some((u) => u.usuario === usuario)) {
          mensaje.textContent = "El usuario ya existe.";
          mensaje.className = "error";
          return;
        }

        usuarios.push({ usuario, password });
        localStorage.setItem("usuarios", JSON.stringify(usuarios));
        mensaje.textContent = "Registro exitoso. Ahora puedes iniciar sesión.";
        mensaje.className = "success";
        document.getElementById("regUsuario").value = "";
        document.getElementById("regPassword").value = "";
      }

      // LOGIN
      function login() {
        const usuario = document.getElementById("loginUsuario").value.trim();
        const password = document.getElementById("loginPassword").value.trim();
        const mensaje = document.getElementById("errorLogin");

        // Validaciones
        if (!usuario || !password) {
          mensaje.textContent = "Debes rellenar ambos campos.";
          mensaje.className = "error";
          return;
        }

        let errorUsuario = validarUsuario(usuario);
        if (errorUsuario) {
          mensaje.textContent = errorUsuario;
          mensaje.className = "error";
          return;
        }

        let errorPassword = validarPassword(password);
        if (errorPassword) {
          mensaje.textContent = errorPassword;
          mensaje.className = "error";
          return;
        }

        // Verificar usuario y contraseña
        let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];
        const user = usuarios.find(
          (u) => u.usuario === usuario && u.password === password
        );

        if (user) {
          // Login exitoso, redirigir al tablero
          window.location.href = "tablero.html";
        } else {
          mensaje.textContent = "Usuario o contraseña incorrectos.";
          mensaje.className = "error";
        }
      }
    </script>
  </body>
</html>
