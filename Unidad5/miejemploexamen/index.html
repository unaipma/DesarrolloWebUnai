<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Login</h1>

  <form id="formLogin">
    <label>Usuario</label>
    <input id="userLogin" type="text" required>

    <label>Contraseña</label>
    <input id="passLogin" type="password" required>

    <button type="submit">Entrar</button>
  </form>

  <p>No tienes cuenta? <a href="register.html">Registrarse</a></p>

  <script src="login.js"></script>
</body>
</html>
