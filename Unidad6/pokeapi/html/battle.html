<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battle</title>
    <script defer src="../js/main.js" type="module"></script>
    <script defer src="../js/battle.js" type="module"></script>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <table id="tabla-pokemon">
      <thead>
        <tr>
          <th id="battle">Battle</th>
          <th id="team">Team</th>
          <th id="historic">Historic</th>
          <th id="import">Import</th>
        </tr>
      </thead>
    </table>
    <div id="content">
      <section id="battlesec"></section>
      <h2 id="ataque"></h2>
      <img id="pokemonimg" src="" alt="Imagen Pokemon" />
      <h4 id="vida"></h4>
     <input id="hpbar" type="range" min="0" max="100" value="100" />

      <section id="botonera">
        <button id="btnescapar">Escapar</button>
        <button id="btnatacar">Atacar</button>
        <button id="btncapturar">Capturar</button>
      </section>
      <h4 id="prueba">Vida entrenador:</h4>
      <input id="mihp" type="range" min="0" max="1000" value="1000" />
      
    </div>
  </body>
</html>
