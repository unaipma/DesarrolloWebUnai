<div class="register-container">
    <div class="register-card">
        <h2>Registro (Local)</h2>
        <div class="form-group">
            <label for="username">Usuario</label>
            <input type="text" id="username" [(ngModel)]="username" placeholder="Elige un usuario">
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" [(ngModel)]="password" placeholder="Elige una contraseña">
        </div>

        @if (errorMessage) {
        <div class="error-message">
            {{ errorMessage }}
        </div>
        }

        @if (successMessage) {
        <div class="success-message">
            {{ successMessage }}
        </div>
        }

        <button (click)="onRegister()">Registrarse</button>

        <div class="switch-auth">
            ¿Ya tienes cuenta? <a (click)="goToLogin()">Inicia sesión aquí</a>
        </div>
    </div>
</div>
